<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 수업 참여 | 도형탐구실</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/entry.css"></head><body class="entry-body"><header><a href="/" class="brand">⬡ <span>도형탐구실<small>STUDENT ENTRY</small></span></a><a class="entry-back" href="/welcome.html">← 역할 다시 선택</a></header><main class="entry-main"><div class="entry-heading"><p class="eyebrow">학생 / 수업 참여</p><h1>준비됐나요?<br><em>이름을 알려 주세요.</em></h1><p>선생님이 안내한 수업 코드와 번호·이름을 입력하세요.</p></div><form id="studentEntry" class="student-entry panel"><label>수업 코드<input id="entryCode" name="code" required maxlength="8" pattern="[A-Za-z2-9]{8}" autocomplete="off" placeholder="8자리 코드"></label><div class="row"><label>출석 번호<input id="entryNo" type="number" min="1" max="99" required inputmode="numeric" placeholder="예: 12"></label><label>이름<input id="entryName" required maxlength="30" autocomplete="name" placeholder="학생 이름"></label></div><p class="caption">번호·이름과 제출 내용은 해당 수업의 선생님에게 전달돼요. 이름과 번호를 정확히 입력해 주세요.</p><button id="entryButton" class="primary" type="submit">수업에 참여하기 →</button><p id="entryStatus" class="entry-status" role="status" aria-live="polite"></p></form><p class="entry-footnote">이전과 같은 정보로 입장하면 이 브라우저에서 작성하던 내용을 이어 쓸 수 있어요.</p></main><script src="/student-session.js"></script><script src="/student.js"></script></body></html>
